name: Validate portfolio proposal
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx eslint src/components/sections/Projects.tsx src/lib/projects.ts
      - run: npm run build -- --webpack
        env:
          NEXT_TELEMETRY_DISABLED: '1'
